spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://mysql:3306/payments_db

payment:
  gateway-url: https://sandbox-gateway.example.com
  retry-times: 3

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
